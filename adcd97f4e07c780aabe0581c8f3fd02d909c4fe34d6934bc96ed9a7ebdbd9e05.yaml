# clash
port: 7890
socks-port: 7891
mixed-port: 7892
allow-lan: false
bind-address: '*'
mode: rule
log-level: info
ipv6: false
find-process-mode: strict
external-controller: '127.0.0.1:9090'
profile:
  store-selected: true
  store-fake-ip: true
unified-delay: true
tcp-concurrent: true
ntp:
  enable: true
  write-to-system: false
  server: ntp.aliyun.com
  port: 123
  interval: 30
dns:
  enable: false
  listen: ':53'
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  prefer-h3: false
  respect-rules: true
  use-hosts: false
  use-system-hosts: false
  ipv6: true
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.arpa'
    - 'time.*.com'
    - 'ntp.*.com'
    - +.market.xiaomi.com
    - localhost.ptlogin2.qq.com
    - '*.msftncsi.com'
    - www.msftconnecttest.com
  default-nameserver:
    - system
    - 223.6.6.6
    - 8.8.8.8
    - '2400:3200::1'
    - '2001:4860:4860::8888'
  nameserver:
    - 'https://cloudflare-dns.com/dns-query'
    - 'https://doh.pub/dns-query'
    - 'https://dns.alidns.com/dns-query'
    - 8.8.8.8
  direct-nameserver:
    - 'https://doh.pub/dns-query'
    - 'https://dns.alidns.com/dns-query'
    - 223.5.5.5
    - 119.29.29.29
  direct-nameserver-follow-policy: true
  fallback:
    - 'https://1.1.1.1/dns-query'
    - 'https://8.8.8.8/dns-query'
    - 'https://dns.google/dns-query'
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32
    domain:
      - +.google.com
      - +.facebook.com
      - +.youtube.com
      - +.twitter.com
      - +.github.com
  proxy-server-nameserver:
    - 'https://doh.pub/dns-query'
    - 'https://dns.alidns.com/dns-query'
    - 'tls://223.5.5.5'
tun:
  enable: true
  stack: system
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - 'any:53'
  device: SakuraiTunnel
  mtu: 1500
  endpoint-independent-nat: true
proxies:
  - name: dl-direct
    type: vless
    server: dl.noah-edu.com
    port: 443
    uuid: 5ca0bcbc-5896-48a2-9a43-ebe72db80dff
    network: ws
    tls: true
    udp: false
    skip-cert-verify: true
    servername: dl.noah-edu.com
    ws-opts:
      path: /wsc-dda46b634fd5
      headers:
        Host: dl.noah-edu.com

  - name: dl-cf
    type: vless
    server: cf1.noah-edu.com
    port: 443
    uuid: 5ca0bcbc-5896-48a2-9a43-ebe72db80dff
    network: ws
    tls: true
    udp: false
    skip-cert-verify: false
    servername: cf1.noah-edu.com
    ws-opts:
      path: /wsc-dda46b634fd5
      headers:
        Host: cf1.noah-edu.com

  - name: dl2-direct
    type: vless
    server: dl2.noah-edu.com
    port: 443
    uuid: cddffbf2-f5ef-4067-bddd-23b75e4ff1a1
    network: ws
    tls: true
    udp: false
    skip-cert-verify: true
    servername: dl2.noah-edu.com
    ws-opts:
      path: /wsc-12347f94a72e
      headers:
        Host: dl2.noah-edu.com

  - name: dl2-cf
    type: vless
    server: cf2.noah-edu.com
    port: 443
    uuid: cddffbf2-f5ef-4067-bddd-23b75e4ff1a1
    network: ws
    tls: true
    udp: false
    skip-cert-verify: false
    servername: cf2.noah-edu.com
    ws-opts:
      path: /wsc-12347f94a72e
      headers:
        Host: cf2.noah-edu.com

  - name: cfw1
    type: vless
    server: cfw1.noah-edu.com
    port: 443
    uuid: 5ca0bcbc-5896-48a2-9a43-ebe72db80dff
    network: ws
    tls: true
    udp: false
    skip-cert-verify: false
    servername: cfw1.noah-edu.com
    ws-opts:
      path: "/"
      headers:
        Host: cfw1.noah-edu.com

  - name: cfw2
    type: vless
    server: cfw2.noah-edu.com
    port: 443
    uuid: cddffbf2-f5ef-4067-bddd-23b75e4ff1a1
    network: ws
    tls: true
    udp: false
    skip-cert-verify: false
    servername: cfw2.noah-edu.com
    ws-opts:
      path: "/"
      headers:
        Host: cfw2.noah-edu.com
proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - DIRECT
      - dl-direct
      - dl-cf
      - dl2-direct
      - dl2-cf
      - cfw1
      - cfw2
  -
    name: 自动选择
    type: url-test
    proxies:
      - DIRECT
      - dl-direct
      - dl-cf
      - dl2-direct
      - dl2-cf
      - cfw1
      - cfw2
    url: 'http://www.gstatic.com/generate_204'
    interval: 180
    tolerance: 25
  -
    name: 负载均衡
    type: load-balance
    proxies:
      - DIRECT
      - dl-direct
      - dl-cf
      - dl2-direct
      - dl2-cf
      - cfw1
      - cfw2
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 50
    strategy: consistent-hashing
